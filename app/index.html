<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Secretário</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="barra-titulo">Secretário</div>
  <div class="app">
    <!-- trilho de servidores -->
    <nav class="trilho">
      <div class="servidor ativo" title="Secretário"><img src="icones/app.png" alt=""></div>
      <div class="separador"></div>
      <button class="servidor acao" id="btn-obsidian" title="Abrir memória no Obsidian">
        <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z M15 3v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12h7M9 16h7" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </nav>

    <!-- lista de conversas -->
    <aside class="lateral">
      <header class="lateral-topo">Secretário</header>
      <div class="secao">
        <span>CONVERSAS</span>
        <button id="btn-nova" title="Nova conversa">+</button>
      </div>
      <ul id="conversas"></ul>

      <!-- painel do usuário (igual ao Discord) -->
      <footer class="usuario">
        <div class="avatar eu">D<span class="bolinha" id="bolinha"></span></div>
        <div class="usuario-info">
          <strong>Deivid</strong>
          <div class="nivel-microfone" title="Nível do microfone"><span id="nivel-microfone"></span></div>
          <small id="estado-texto">carregando…</small>
        </div>
        <button class="icone" id="btn-mudo" title="Mutar microfone">
          <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M5 11a7 7 0 0 0 14 0 M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="risco" d="M4 4l16 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
        <button class="icone" id="btn-silencio" title="Silenciar a voz do secretário">
          <svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2 M4 14h3v6H4z M17 14h3v6h-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path class="risco" d="M4 4l16 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </footer>
    </aside>

    <!-- chat -->
    <main class="chat">
      <header class="chat-topo">
        <span class="hash">#</span><span id="titulo-conversa">geral</span>
        <span class="chip" id="chip-estado">carregando</span>
      </header>
      <section id="mensagens"></section>
      <div class="digitando" id="digitando" hidden>
        <span class="pontos"><i></i><i></i><i></i></span>
        <span id="digitando-texto">Secretário está trabalhando…</span>
        <button id="btn-cancelar">Cancelar</button>
      </div>
      <form class="entrada" id="form">
        <button type="button" class="icone" id="btn-falar" title="Falar agora (Ctrl+Shift+Espaço)">
          <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M5 11a7 7 0 0 0 14 0 M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <textarea id="texto" rows="1" placeholder="Conversar com o secretário  ·  ou diga “Secretário, …”"></textarea>
      </form>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
